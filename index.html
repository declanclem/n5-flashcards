<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JLPT N5 Rapid Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .badge {
      background: #334155;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.8rem;
    }
    .controls-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .card-wrap {
      width: 100%;
      max-width: 480px;
      height: 250px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #172033;
      border-color: #3b82f6;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .prompt-text {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: auto 0;
      color: var(--text-main);
    }
    .answer-kana {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
    }
    .answer-romaji {
      font-size: 1.1rem;
      color: #cbd5e1;
      text-align: center;
      font-style: italic;
    }
    .answer-meaning {
      font-size: 1.3rem;
      color: #f1f5f9;
      font-weight: 600;
      text-align: center;
      margin-top: 4px;
    }
    .tap-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .input-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      user-select: text;
    }
    .input-box:focus {
      border-color: var(--accent);
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .icon-btn.recording {
      background: #7f1d1d;
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .action-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 14px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
    }
    .btn-missed { background: #dc2626; }
    .btn-flip { background: #3b82f6; }
    .btn-gotit { background: #16a34a; }
    .btn:active { opacity: 0.8; transform: translateY(1px); }
    .status-msg {
      width: 100%;
      max-width: 480px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 8px;
    }
    .status-msg.correct { color: var(--success); }
    .status-msg.incorrect { color: var(--danger); }
    .status-msg.info { color: var(--accent); }
  </style>
</head>

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initDeck() {
      try {
        const selectedLesson = lessonFilter ? lessonFilter.value : 'all';
        if (selectedLesson === 'all') {
          currentDeck = [...VOCAB_DATA];
        } else {
          const num = parseInt(selectedLesson, 10);
          currentDeck = VOCAB_DATA.filter(item => item.l === num);
        }
        shuffle(currentDeck);
        currentIndex = 0;
        loadCard();
      } catch (err) {
        if (statusMsg) statusMsg.textContent = "Init error: " + err.message;
      }
    }

    function getActiveMode() {
      const mode = promptMode ? promptMode.value : 'kanji';
      if (mode === 'mixed') {
        const modes = ['kanji', 'kana', 'romaji', 'english'];
        return modes[Math.floor(Math.random() * modes.length)];
      }
      return mode;
    }

    let activeCardMode = 'kanji';

    function loadCard() {
      if (!currentDeck || currentDeck.length === 0) {
        promptText.textContent = "No cards";
        return;
      }
      isFlipped = false;
      cardInner.classList.remove('flipped');
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
      userInput.value = "";

      const card = currentDeck[currentIndex];
      activeCardMode = getActiveMode();

      if (activeCardMode === 'kanji') {
        promptLabel.textContent = "KANJI / KANA";
        promptText.textContent = card.k || card.f;
      } else if (activeCardMode === 'kana') {
        promptLabel.textContent = "FURIGANA";
        promptText.textContent = card.f;
      } else if (activeCardMode === 'romaji') {
        promptLabel.textContent = "ROMAJI";
        promptText.textContent = card.r;
      } else if (activeCardMode === 'english') {
        promptLabel.textContent = "ENGLISH";
        promptText.textContent = card.e.split('/')[0].trim();
      }

      ansKana.textContent = card.f;
      ansRomaji.textContent = card.r;
      ansMeaning.textContent = card.e;
      lessonTag.textContent = "Lesson " + card.l;
      stats.textContent = (currentIndex + 1) + " / " + currentDeck.length;
    }

    function flipCard() {
      isFlipped = !isFlipped;
      if (isFlipped) {
        cardInner.classList.add('flipped');
      } else {
        cardInner.classList.remove('flipped');
      }
    }

    function nextCard() {
      if (currentIndex < currentDeck.length - 1) {
        currentIndex++;
        loadCard();
      } else {
        statusMsg.textContent = "Deck finished! Reshuffling...";
        statusMsg.className = "status-msg info";
        setTimeout(initDeck, 1200);
      }
    }

    function cleanStr(s) {
      return (s || "")
        .toLowerCase()
        .replace(/^to\s+/, '')
        .replace(/^(a|an|the)\s+/, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function checkAnswer(val) {
      if (!val || !val.trim()) return;
      const card = currentDeck[currentIndex];
      const cleanedInput = cleanStr(val);

      if (activeCardMode === 'english') {
        const cleanedRomaji = cleanStr(card.r);
        const altRomaji = cleanedRomaji.replace(/oo/g, 'ou').replace(/ee/g, 'ei');
        const match = cleanedInput === cleanedRomaji || cleanedInput === altRomaji || val.trim() === card.f;

        if (match) {
          statusMsg.textContent = "Correct! ✓";
          statusMsg.className = "status-msg correct";
          if (!isFlipped) flipCard();
        } else {
          statusMsg.textContent = "Try again or tap Flip to view.";
          statusMsg.className = "status-msg incorrect";
        }
      } else {
        const meanings = card.e.split(/[\/,]/).map(cleanStr);
        const isMatch = meanings.some(m => m === cleanedInput || (m.length > 3 && cleanedInput.includes(m)));

        if (isMatch) {
          statusMsg.textContent = "Correct! ✓";
          statusMsg.className = "status-msg correct";
          if (!isFlipped) flipCard();
        } else {
          statusMsg.textContent = "Not quite. Check answer!";
          statusMsg.className = "status-msg incorrect";
        }
      }
    }

    function speakText(txt, lang) {
      if (!('speechSynthesis' in window)) {
        statusMsg.textContent = "Speech synthesis not supported.";
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = lang || 'ja-JP';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } catch (err) {
        console.error(err);
      }
    }

    // Direct event listener attachments
    if (cardWrap) cardWrap.onclick = flipCard;
    if (btnFlip) btnFlip.onclick = flipCard;
    if (btnGotIt) btnGotIt.onclick = () => nextCard();
    if (btnMissed) {
      btnMissed.onclick = () => {
        const card = currentDeck[currentIndex];
        currentDeck.splice(currentIndex + 4, 0, card);
        nextCard();
      };
    }

    if (speakerBtn) {
      speakerBtn.onclick = (e) => {
        e.stopPropagation();
        const card = currentDeck[currentIndex];
        if (activeCardMode === 'english') {
          speakText(card.e.split('/')[0], 'en-US');
        } else {
          speakText(card.f, 'ja-JP');
        }
      };
    }

    if (userInput) {
      userInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          checkAnswer(userInput.value);
        }
      };
    }

    if (lessonFilter) lessonFilter.onchange = initDeck;
    if (promptMode) promptMode.onchange = loadCard;

    // Speech Recognition initialization
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec && micBtn) {
      recognition = new SpeechRec();
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        statusMsg.textContent = "Listening...";
        statusMsg.className = "status-msg info";
      };

      recognition.onresult = (evt) => {
        const transcript = evt.results[0][0].transcript;
        userInput.value = transcript;
        checkAnswer(transcript);
      };

      recognition.onerror = (e) => {
        statusMsg.textContent = "Mic error: " + (e.error || 'Check permissions');
        statusMsg.className = "status-msg incorrect";
        micBtn.classList.remove('recording');
        isRecording = false;
      };

      recognition.onend = () => {
        micBtn.classList.remove('recording');
        isRecording = false;
      };

      micBtn.onclick = (e) => {
        e.stopPropagation();
        if (isRecording) {
          recognition.stop();
          return;
        }
        recognition.lang = (activeCardMode === 'english') ? 'ja-JP' : 'en-US';
        try {
          recognition.start();
        } catch (err) {
          recognition.stop();
        }
      };
    } else if (micBtn) {
      micBtn.style.opacity = '0.5';
      micBtn.onclick = () => {
        statusMsg.textContent = "Voice recognition not supported or mic disabled.";
        statusMsg.className = "status-msg info";
      };
    }

    // Direct synchronous execution
    initDeck();
  </script>
