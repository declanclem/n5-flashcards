<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>JLPT N5 Rapid Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --kanji-target: #f87171;
      --mastered-gold: #f59e0b;
      --success: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      width: 100%;
    }
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      background: #334155;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .review-filter-btn {
      background: #451a1a;
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      display: none;
    }
    .review-filter-btn.active {
      background: var(--danger);
      color: #fff;
    }

    .controls-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .prompt-select-bar {
      width: 100%;
      max-width: 440px;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      min-width: 0;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 9px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .toggle-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      background: #172033;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .toggle-item input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .card-wrap {
      width: 100%;
      max-width: 440px;
      height: 255px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 16px;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #172033;
      border-color: #3b82f6;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-badges-container {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .card-status-badge {
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.72rem;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .status-unseen {
      background: #334155;
      color: var(--text-muted);
    }
    .status-passed {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status-failed {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    .status-mastered {
      background: rgba(245, 158, 11, 0.2);
      color: var(--mastered-gold);
      border: 1px solid var(--mastered-gold);
      display: none;
    }

    .action-icon-badge {
      font-size: 2.3rem;
      line-height: 1;
      text-align: center;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
      margin-bottom: 2px;
    }

    .prompt-text {
      text-align: center;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: auto 0;
      color: var(--text-main);
      padding: 0 8px;
    }
    .n5-target-kanji {
      color: var(--kanji-target);
      font-weight: 800;
    }
    .answer-kana {
      font-size: 1.3rem;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
    }
    .answer-romaji {
      font-size: 1rem;
      color: #cbd5e1;
      text-align: center;
      font-style: italic;
    }
    .answer-meaning {
      font-size: 1.2rem;
      color: #f1f5f9;
      font-weight: 600;
      text-align: center;
    }
    .mnemonic-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px dashed rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.75rem;
      color: #bae6fd;
      text-align: center;
      line-height: 1.25;
      margin-top: 4px;
    }
    .tap-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .input-section {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .input-box {
      flex: 1;
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    .input-box:focus {
      border-color: var(--accent);
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .icon-btn.recording {
      background: #7f1d1d;
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .status-msg {
      width: 100%;
      max-width: 440px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 22px;
      margin-bottom: 8px;
    }
    .status-msg.correct { color: var(--success); }
    .status-msg.incorrect { color: var(--danger); }
    .status-msg.info { color: var(--accent); }

    .action-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1.1fr 0.85fr 1fr 1.15fr;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 12px 4px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .btn-mastered {
      background: #854d0e;
      color: #fef08a;
      border: 1px solid var(--mastered-gold);
    }
    .btn-mastered.is-mastered {
      background: var(--mastered-gold);
      color: #000;
    }
    .btn-skip { background: #475569; }
    .btn-flip { background: #3b82f6; }
    .btn-next { background: #0284c7; }
    .btn:active { opacity: 0.8; transform: translateY(1px); }
  </style>
</head>
<body>
  <header>
    <span>JLPT N5 Drill</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="review-filter-btn" id="reviewFailuresBtn">Failures: 0</button>
      <span class="badge" id="stats">0 / 0 (0%)</span>
    </div>
  </header>

  <div class="controls-grid">
    <select id="masteryFilter">
      <option value="unmastered" selected>Cohort: Unmastered</option>
      <option value="mastered">Cohort: Mastered Only</option>
      <option value="all">Cohort: All Cards</option>
    </select>

    <select id="lessonFilter">
      <option value="verbs" selected>★ Core Verbs Only (74 Actions)</option>
      <option value="all">All Lessons (1–15)</option>
      <option value="1">L1: Basics</option>
      <option value="2">L2: Family & Items</option>
      <option value="3">L3: Office & Rooms</option>
      <option value="4">L4: Calendar & Time</option>
      <option value="5">L5: Verbs & Dining</option>
      <option value="6">L6: Transit & Spots</option>
      <option value="7">L7: Jobs & Hobbies</option>
      <option value="8">L8: Adjectives</option>
      <option value="9">L9: Food & Places</option>
      <option value="10">L10: Tastes & Likes</option>
      <option value="11">L11: Daily Life</option>
      <option value="12">L12: Weather & Nature</option>
      <option value="13">L13: Clothes & Wants</option>
      <option value="14">L14: Counters</option>
      <option value="15">L15: Health & Ability</option>
    </select>
  </div>

  <div class="prompt-select-bar">
    <select id="promptMode">
      <option value="kanji" selected>Kanji / Kana ➔ English</option>
      <option value="reading">Kanji ➔ Reading (Romaji/Kana)</option>
      <option value="jukugo_reading">Compound Onyomi (Jukugo) ➔ Reading</option>
      <option value="jukugo_english">Compound Onyomi (Jukugo) ➔ English</option>
      <option value="english">English ➔ Japanese Reading</option>
    </select>
  </div>

  <div class="toggle-bar">
    <label class="toggle-item">
      <input type="checkbox" id="toggleAutoSpeak" />
      <span>Auto-speak prompt</span>
    </label>
    <label class="toggle-item">
      <input type="checkbox" id="toggleAutoListen" />
      <span>Auto-listen (mic)</span>
    </label>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card-inner" id="cardInner">
      <div class="card-front">
        <div class="card-meta">
          <span id="promptLabel">PROMPT</span>
          <div class="card-badges-container">
            <span class="card-status-badge status-mastered" id="cardMasteredFront">★ Mastered</span>
            <span class="card-status-badge status-unseen" id="cardStatusFront">Unseen</span>
            <button class="icon-btn" id="speakerBtn" style="padding:4px 8px; font-size:1rem;" title="Listen">🔊</button>
          </div>
        </div>
        <div class="action-icon-badge" id="cardIconFront">🏃</div>
        <div class="prompt-text" id="promptText">Loading...</div>
        <div class="tap-hint">Tap card or press [Flip] to reveal</div>
      </div>
      <div class="card-back">
        <div class="card-meta">
          <span>ANSWER & BREAKDOWN</span>
          <div class="card-badges-container">
            <span class="card-status-badge status-mastered" id="cardMasteredBack">★ Mastered</span>
            <span class="card-status-badge status-unseen" id="cardStatusBack">Unseen</span>
            <span id="lessonTag" style="color:var(--accent);">L1</span>
          </div>
        </div>
        <div style="margin: auto 0; display:flex; flex-direction:column; gap:4px;">
          <div class="action-icon-badge" id="cardIconBack" style="font-size:1.8rem;">🏃</div>
          <div class="answer-kana" id="ansKana">--</div>
          <div class="answer-romaji" id="ansRomaji">--</div>
          <div class="answer-meaning" id="ansMeaning">--</div>
          <div class="mnemonic-box" id="mnemonicBox">--</div>
        </div>
        <div class="tap-hint">Tap to flip back</div>
      </div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="input-section">
    <input 
      type="text" 
      id="userInput" 
      class="input-box" 
      placeholder="Type answer or 'skip'..." 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="off" 
      spellcheck="false"
    />
    <button class="icon-btn" id="micBtn" title="Speak Answer">🎤</button>
  </div>

  <div class="action-grid">
    <button class="btn btn-mastered" id="btnMastered">★ Mastered</button>
    <button class="btn btn-skip" id="btnSkip">↷ Skip</button>
    <button class="btn btn-flip" id="btnFlip">↻ Flip</button>
    <button class="btn btn-next" id="btnNext">Next ➔</button>
  </div>

  <script src="vocab.js?v=5"></script>

      "てつだう": { icon: "🤝", m: "Tetsu doubts he can, so *help* (*tetsudau*)." },
      "たつ": { icon: "🧍", m: "**Tats** on legs as you *stand up* (*tatsu*)." },
      "みせる": { icon: "🖼️", m: "**Miss L** (*miseru*) will *show* the picture." },
      "つける": { icon: "💡", m: "**Two kettles** (*tsukeru*) *turn on* lights." },
      "けす": { icon: "🔌", m: "**Kiss** light goodbye: *turn off / erase* (*kesu*)." },
      "おぼえる": { icon: "🧠", m: "**Oh boy** (*oboeru*), I *remember* it now!" },
      "わすれる": { icon: "🤷", m: "**Was real**? I *forget* (*wasureru*)." },
      "つかう": { icon: "🛠️", m: "Two cows (*tsukau*) *use* plough." },
      "うまれる": { icon: "👶", m: "A mother (*umareru*) bears child: *be born*." },
      "がんばる": { icon: "💪", m: "Gambler holds on: *do your best* (*ganbaru*)." },
      "とぶ": { icon: "🕊️", m: "**Toe big** but bird *flies* (*tobu*)." },
      "きえる": { icon: "💨", m: "Key errs (*kieru*) and *disappears* into thin air." },
      "わたす": { icon: "🤝", m: "Waiters (*watasu*) *hand over* tray." },
      "わたる": { icon: "🌉", m: "**Water** below as you *cross bridge* (*wataru*)." },
      "できる": { icon: "✨", m: "Deck rules (*dekiru*): yes you *can* do it!" }
    };

    function isVerbEntry(card) {
      if (!card) return false;
      const cleanKana = (card.f || "").replace(/[^ぁ-ん]/g, "");
      if (VERB_DICTIONARY[cleanKana]) return true;
      const e = (card.e || "").toLowerCase();
      return e.startsWith("to ") || e.includes(" / to ") || e.includes("to get");
    }

    const N5_KANJI_SET = new Set([
      "一","二","三","四","五","六","七","八","九","十","百","千","万","円","年","日","月","火","水","木","金","土",
      "今","前","後","午","朝","昼","晩","夜","分","半","時","週","間","毎","先","来","去","何",
      "上","下","左","右","東","西","南","北","中","外",
      "駅","校","高","大","小","長","短","白","黒","赤","青","新","古","多","少","安","近","遠","広","早","明","暗","好",
      "友","手","足","目","耳","口","体","人","子","女","男","父","母","兄","弟","姉","妹",
      "見","聞","行","帰","食","飲","入","出","立","休","買","書","読","話","言",
      "天","気","雨","電","車","名","国","社","店","道","山","川","花","魚","空"
    ]);

    function isKanjiChar(ch) {
      return /[\u4e00-\u9faf]/.test(ch);
    }

    function isJukugoWord(card) {
      if (!card || !card.k) return false;
      const k = card.k.trim();
      if (k.length < 2) return false;
      for (const ch of k) {
        if (!isKanjiChar(ch) || !N5_KANJI_SET.has(ch)) {
          return false;
        }
      }
      return true;
    }

    function formatPromptKanji(str) {
      if (!str) return "";
      let html = "";
      for (const ch of str) {
        if (N5_KANJI_SET.has(ch)) {
          html += `<span class="n5-target-kanji">${ch}</span>`;
        } else {
          html += ch;
        }
      }
      return html;
    }

    let currentDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let recognition = null;
    let isRecording = false;
    let listenTimer = null;

    const STORAGE_KEY_MASTERED = "n5_mastered_vocab_keys";
    function loadMasteredSet() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY_MASTERED);
        return raw ? new Set(JSON.parse(raw)) : new Set();
      } catch (e) {
        return new Set();
      }
    }
    function persistMasteredSet(set) {
      try {
        localStorage.setItem(STORAGE_KEY_MASTERED, JSON.stringify(Array.from(set)));
      } catch (e) {}
    }
    const masteredCardsSet = loadMasteredSet();

    const sessionHistory = new Map();
    let isReviewingFailures = false;

    let totalAttempts = 0;
    let correctCount = 0;

    const cardWrap = document.getElementById('cardWrap');
    const cardInner = document.getElementById('cardInner');
    const promptText = document.getElementById('promptText');
    const promptLabel = document.getElementById('promptLabel');
    const cardIconFront = document.getElementById('cardIconFront');
    const cardIconBack = document.getElementById('cardIconBack');
    const cardStatusFront = document.getElementById('cardStatusFront');
    const cardStatusBack = document.getElementById('cardStatusBack');
    const cardMasteredFront = document.getElementById('cardMasteredFront');
    const cardMasteredBack = document.getElementById('cardMasteredBack');
    const ansKana = document.getElementById('ansKana');
    const ansRomaji = document.getElementById('ansRomaji');
    const ansMeaning = document.getElementById('ansMeaning');
    const mnemonicBox = document.getElementById('mnemonicBox');
    const lessonTag = document.getElementById('lessonTag');
    const stats = document.getElementById('stats');
    const statusMsg = document.getElementById('statusMsg');
    const userInput = document.getElementById('userInput');
    const speakerBtn = document.getElementById('speakerBtn');
    const micBtn = document.getElementById('micBtn');
    const masteryFilter = document.getElementById('masteryFilter');
    const lessonFilter = document.getElementById('lessonFilter');
    const promptMode = document.getElementById('promptMode');
    const btnMastered = document.getElementById('btnMastered');
    const btnSkip = document.getElementById('btnSkip');
    const btnFlip = document.getElementById('btnFlip');
    const btnNext = document.getElementById('btnNext');
    const reviewFailuresBtn = document.getElementById('reviewFailuresBtn');
    const toggleAutoSpeak = document.getElementById('toggleAutoSpeak');
    const toggleAutoListen = document.getElementById('toggleAutoListen');

    function getCardKey(card) {
      return `${card.l}-${card.k}-${card.f}`;
    }

    function updateStatsHeader() {
      const pct = totalAttempts === 0 ? 0 : Math.round((correctCount / totalAttempts) * 100);
      stats.textContent = `${correctCount} / ${totalAttempts} (${pct}%) • ${currentDeck.length ? currentIndex + 1 : 0}/${currentDeck.length}`;

      let failureCount = 0;
      sessionHistory.forEach((status) => {
        if (status === 'failed') failureCount++;
      });
      if (failureCount > 0) {
        reviewFailuresBtn.style.display = "block";
        reviewFailuresBtn.textContent = isReviewingFailures ? `Exit Review (${failureCount})` : `Review Failed (${failureCount})`;
      } else {
        reviewFailuresBtn.style.display = "none";
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initDeck() {
      destroyVoiceEngine();
      if (listenTimer) clearTimeout(listenTimer);

      const data = window.VOCAB_DATA;
      if (!data || data.length === 0) {
        promptText.textContent = "vocab.js missing";
        statusMsg.textContent = "vocab.js not found.";
        return;
      }

      let filtered = [...data];

      if (isReviewingFailures) {
        filtered = filtered.filter(item => sessionHistory.get(getCardKey(item)) === 'failed');
        reviewFailuresBtn.classList.add('active');
      } else {
        reviewFailuresBtn.classList.remove('active');
        
        // 1. Mastery Status Filter
        const selectedMastery = masteryFilter ? masteryFilter.value : 'unmastered';
        if (selectedMastery === 'unmastered') {
          filtered = filtered.filter(item => !masteredCardsSet.has(getCardKey(item)));
        } else if (selectedMastery === 'mastered') {
          filtered = filtered.filter(item => masteredCardsSet.has(getCardKey(item)));
        }

        // 2. Lesson / Category Filter
        const selectedLesson = lessonFilter ? lessonFilter.value : 'verbs';
        if (selectedLesson === 'verbs') {
          filtered = filtered.filter(item => isVerbEntry(item));
        } else if (selectedLesson !== 'all') {
          const num = parseInt(selectedLesson, 10);
          filtered = filtered.filter(item => item.l === num);
        }

        // 3. Prompt Mode Sub-filter (for Compound Onyomi)
        const activeModeVal = promptMode ? promptMode.value : 'kanji';
        if (activeModeVal === 'jukugo_reading' || activeModeVal === 'jukugo_english') {
          filtered = filtered.filter(item => isJukugoWord(item));
        }
      }

      currentDeck = filtered;
      shuffle(currentDeck);
      currentIndex = 0;
      loadCard();
    }

    function setBadgeVisual(el, status) {
      el.className = 'card-status-badge';
      if (status === 'passed') {
        el.classList.add('status-passed');
        el.textContent = '✓ Pass';
      } else if (status === 'failed') {
        el.classList.add('status-failed');
        el.textContent = '✗ Fail';
      } else {
        el.classList.add('status-unseen');
        el.textContent = 'Unseen';
      }
    }

    function updateMasteredButtonVisual(isMastered) {
      if (isMastered) {
        btnMastered.classList.add('is-mastered');
        btnMastered.textContent = '★ Mastered';
        cardMasteredFront.style.display = 'inline-flex';
        cardMasteredBack.style.display = 'inline-flex';
      } else {
        btnMastered.classList.remove('is-mastered');
        btnMastered.textContent = '☆ Mastered';
        cardMasteredFront.style.display = 'none';
        cardMasteredBack.style.display = 'none';
      }
    }

    function toggleMasteredCurrentCard() {
      if (!currentDeck || currentDeck.length === 0) return;
      const card = currentDeck[currentIndex];
      const key = getCardKey(card);
      const isCurrentlyMastered = masteredCardsSet.has(key);

      if (isCurrentlyMastered) {
        masteredCardsSet.delete(key);
        persistMasteredSet(masteredCardsSet);
        updateMasteredButtonVisual(false);
        statusMsg.textContent = "Moved back to unmastered cohort.";
        statusMsg.className = "status-msg info";
      } else {
        masteredCardsSet.add(key);
        persistMasteredSet(masteredCardsSet);
        updateMasteredButtonVisual(true);
        statusMsg.textContent = "Mastered! ★ Advancing...";
        statusMsg.className = "status-msg correct";

        setTimeout(() => {
          advanceNext();
        }, 400);
      }
    }

    function loadCard() {
      destroyVoiceEngine();
      if (listenTimer) clearTimeout(listenTimer);

      if (!currentDeck || currentDeck.length === 0) {
        promptLabel.textContent = "INFO";
        cardIconFront.style.display = "none";
        cardIconBack.style.display = "none";
        mnemonicBox.style.display = "none";
        promptText.innerHTML = "No cards remaining in filter!";
        ansKana.textContent = "--";
        ansRomaji.textContent = "--";
        ansMeaning.textContent = "--";
        updateMasteredButtonVisual(false);
        updateStatsHeader();
        return;
      }
      isFlipped = false;
      cardInner.classList.remove('flipped');
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
      userInput.value = "";

      const card = currentDeck[currentIndex];
      const activeCardMode = promptMode ? promptMode.value : 'kanji';

      const cleanF = (card.f || "").replace(/[^ぁ-ん]/g, "");
      const verbData = VERB_DICTIONARY[cleanF];

      if (verbData) {
        cardIconFront.textContent = verbData.icon;
        cardIconBack.textContent = verbData.icon;
        cardIconFront.style.display = "block";
        cardIconBack.style.display = "block";
        mnemonicBox.style.display = "block";
        mnemonicBox.innerHTML = `<strong>Mnemonic:</strong> ${verbData.m}`;
      } else {
        cardIconFront.style.display = "none";
        cardIconBack.style.display = "none";
        mnemonicBox.style.display = "none";
      }

      const currentStatus = sessionHistory.get(getCardKey(card)) || 'unseen';
      setBadgeVisual(cardStatusFront, currentStatus);
      setBadgeVisual(cardStatusBack, currentStatus);

      const isMastered = masteredCardsSet.has(getCardKey(card));
      updateMasteredButtonVisual(isMastered);

      // Unambiguous label and input directions for each of the 5 modes
      if (activeCardMode === 'reading') {
        promptLabel.textContent = isVerbEntry(card) ? "VERB ➔ READING (ROMAJI/KANA)" : "KANJI ➔ READING (ROMAJI/KANA)";
        promptText.innerHTML = formatPromptKanji(card.k || card.f);
        userInput.placeholder = "Type/speak reading (Romaji or Kana)...";
      } else if (activeCardMode === 'jukugo_reading') {
        promptLabel.textContent = "COMPOUND ON'YOMI ➔ READING (ROMAJI/KANA)";
        promptText.innerHTML = formatPromptKanji(card.k);
        userInput.placeholder = "Type/speak reading (Romaji or Kana)...";
      } else if (activeCardMode === 'jukugo_english') {
        promptLabel.textContent = "COMPOUND ON'YOMI ➔ ENGLISH MEANING";
        promptText.innerHTML = formatPromptKanji(card.k);
        userInput.placeholder = "Type/speak English meaning...";
      } else if (activeCardMode === 'english') {
        promptLabel.textContent = "ENGLISH ➔ JAPANESE READING";
        promptText.textContent = card.e.split('/')[0].trim();
        userInput.placeholder = "Type/speak Japanese reading...";
      } else {
        promptLabel.textContent = isVerbEntry(card) ? "VERB ➔ ENGLISH MEANING" : "KANJI / KANA ➔ ENGLISH MEANING";
        promptText.innerHTML = formatPromptKanji(card.k || card.f);
        userInput.placeholder = "Type/speak English meaning...";
      }

      ansKana.textContent = card.f;
      ansRomaji.textContent = card.r;
      ansMeaning.textContent = card.e;
      lessonTag.textContent = "L" + card.l;
      updateStatsHeader();

      if (toggleAutoSpeak && toggleAutoSpeak.checked) {
        if (activeCardMode !== 'reading' && activeCardMode !== 'jukugo_reading') {
          triggerAudioPrompt(() => {
            if (toggleAutoListen && toggleAutoListen.checked) {
              listenTimer = setTimeout(spawnVoiceSession, 350);
            }
          });
          return;
        }
      }

      if (toggleAutoListen && toggleAutoListen.checked) {
        listenTimer = setTimeout(spawnVoiceSession, 350);
      }
    }

    function triggerAudioPrompt(onDoneCallback) {
      if (!currentDeck.length) return;
      const card = currentDeck[currentIndex];
      const activeCardMode = promptMode ? promptMode.value : 'kanji';
      if (activeCardMode === 'english') {
        speakText(card.e.split('/')[0], 'en-US', onDoneCallback);
      } else {
        speakText(card.f, 'ja-JP', onDoneCallback);
      }
    }

    function flipCard() {
      if (!currentDeck.length) return;
      isFlipped = !isFlipped;
      if (isFlipped) {
        cardInner.classList.add('flipped');
      } else {
        cardInner.classList.remove('flipped');
      }
    }

    function advanceNext() {
      destroyVoiceEngine();
      if (listenTimer) clearTimeout(listenTimer);

      if (currentIndex < currentDeck.length - 1) {
        currentIndex++;
        loadCard();
      } else {
        statusMsg.textContent = "Cohort review complete! Reshuffling...";
        statusMsg.className = "status-msg info";
        setTimeout(initDeck, 1200);
      }
    }

    function skipCard() {
      if (!currentDeck.length) return;
      statusMsg.textContent = "Skipped";
      statusMsg.className = "status-msg info";
      advanceNext();
    }

    function cleanStr(s) {
      return (s || "")
        .toLowerCase()
        .replace(/^to\s+/, '')
        .replace(/^(a|an|the)\s+/, '')
        .replace(/[^a-z0-9ぁ-んァ-ヶー]/g, '');
    }

    function checkAnswer(val) {
      if (!val || !val.trim() || !currentDeck.length) return;
      
      const cleanInput = cleanStr(val);

      if (cleanInput === "skip" || cleanInput === "next") {
        skipCard();
        return;
      }

      totalAttempts++;
      const card = currentDeck[currentIndex];
      const cardKey = getCardKey(card);
      const activeCardMode = promptMode ? promptMode.value : 'kanji';
      let isCorrect = false;

      if (activeCardMode === 'reading' || activeCardMode === 'jukugo_reading' || activeCardMode === 'english') {
        const cleanedRomaji = cleanStr(card.r);
        const altRomaji = cleanedRomaji.replace(/oo/g, 'ou').replace(/ee/g, 'ei');
        const cleanKana = cleanStr(card.f);
        
        isCorrect = (
          cleanInput === cleanedRomaji || 
          cleanInput === altRomaji || 
          cleanInput === cleanKana || 
          cleanInput.replace(/ou/g, 'oo') === cleanedRomaji
        );
      } else {
        const meanings = card.e.split(/[\/,]/).map(cleanStr);
        isCorrect = meanings.some(m => m === cleanInput || (m.length > 3 && cleanInput.includes(m)));
      }

      if (isCorrect) {
        destroyVoiceEngine();
        correctCount++;
        sessionHistory.set(cardKey, 'passed');
        setBadgeVisual(cardStatusFront, 'passed');
        setBadgeVisual(cardStatusBack, 'passed');

        statusMsg.textContent = "Correct! ✓ Tap [★ Mastered] to retire, or [Next ➔] to keep drilling.";
        statusMsg.className = "status-msg correct";
        updateStatsHeader();
        if (!isFlipped) flipCard();
      } else {
        sessionHistory.set(cardKey, 'failed');
        setBadgeVisual(cardStatusFront, 'failed');
        setBadgeVisual(cardStatusBack, 'failed');

        statusMsg.textContent = "Incorrect. Review card & tap [Next ➔]";
        statusMsg.className = "status-msg incorrect";
        updateStatsHeader();
        if (!isFlipped) flipCard();
      }
    }

    window._currentUtterance = null;
    let synthTimeout = null;

    function speakText(txt, lang, onEnd) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      try {
        if (synthTimeout) clearTimeout(synthTimeout);

        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
        }
        window.speechSynthesis.cancel();

        const u = new SpeechSynthesisUtterance(txt);
        u.lang = lang || 'ja-JP';
        u.rate = 0.9;
        window._currentUtterance = u;

        let hasFinished = false;
        function finish() {
          if (!hasFinished) {
            hasFinished = true;
            window._currentUtterance = null;
            if (synthTimeout) clearTimeout(synthTimeout);
            if (onEnd) onEnd();
          }
        }

        u.onend = finish;
        u.onerror = finish;
        synthTimeout = setTimeout(finish, 2800);

        window.speechSynthesis.speak(u);
      } catch (err) {
        if (onEnd) onEnd();
      }
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    function destroyVoiceEngine() {
      if (recognition) {
        try {
          recognition.onstart = null;
          recognition.onresult = null;
          recognition.onerror = null;
          recognition.onend = null;
          recognition.abort();
        } catch (e) {}
        recognition = null;
      }
      isRecording = false;
      micBtn.classList.remove('recording');
    }

    function spawnVoiceSession() {
      if (!SpeechRec) return;
      destroyVoiceEngine();

      try {
        const rec = new SpeechRec();
        rec.continuous = false;
        rec.interimResults = false;
        const activeCardMode = promptMode ? promptMode.value : 'kanji';
        const expectsJapanese = (activeCardMode === 'reading' || activeCardMode === 'jukugo_reading' || activeCardMode === 'english');
        rec.lang = expectsJapanese ? 'ja-JP' : 'en-US';

        rec.onstart = () => {
          isRecording = true;
          micBtn.classList.add('recording');
          statusMsg.textContent = "Listening...";
          statusMsg.className = "status-msg info";
        };

        rec.onresult = (evt) => {
          const transcript = evt.results[0][0].transcript;
          userInput.value = transcript;
          checkAnswer(transcript);
        };

        rec.onerror = (e) => {
          destroyVoiceEngine();
          if (e.error === 'aborted' || e.error === 'no-speech') {
            if (toggleAutoListen && toggleAutoListen.checked && !isFlipped) {
              listenTimer = setTimeout(spawnVoiceSession, 400);
            }
            return;
          }
          statusMsg.textContent = "Voice error: " + (e.error || 'Retry');
          statusMsg.className = "status-msg incorrect";
        };

        rec.onend = () => {
          destroyVoiceEngine();
        };

        recognition = rec;
        rec.start();
      } catch (err) {
        destroyVoiceEngine();
        if (toggleAutoListen && toggleAutoListen.checked && !isFlipped) {
          listenTimer = setTimeout(spawnVoiceSession, 450);
        }
      }
    }

    if (cardWrap) cardWrap.onclick = flipCard;
    if (btnFlip) btnFlip.onclick = flipCard;
    if (btnSkip) btnSkip.onclick = skipCard;
    if (btnNext) btnNext.onclick = advanceNext;
    if (btnMastered) btnMastered.onclick = toggleMasteredCurrentCard;

    if (reviewFailuresBtn) {
      reviewFailuresBtn.onclick = () => {
        isReviewingFailures = !isReviewingFailures;
        initDeck();
      };
    }

    if (speakerBtn) {
      speakerBtn.onclick = (e) => {
        e.stopPropagation();
        triggerAudioPrompt();
      };
    }

    if (userInput) {
      userInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          checkAnswer(userInput.value);
        }
      };
    }

    if (masteryFilter) masteryFilter.onchange = initDeck;
    if (lessonFilter) lessonFilter.onchange = initDeck;
    if (promptMode) promptMode.onchange = initDeck;

    if (micBtn) {
      micBtn.onclick = (e) => {
        e.stopPropagation();
        if (isRecording) {
          destroyVoiceEngine();
          statusMsg.textContent = "";
        } else {
          spawnVoiceSession();
        }
      };
    }

    initDeck();
  </script>
</body>
</html>
