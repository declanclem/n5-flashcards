<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JLPT N5 Rapid Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --kanji-target: #f87171;
      --success: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
      width: 100%;
    }
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .badge {
      background: #334155;
      padding: 5px 10px;
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
    }
    .review-filter-btn {
      background: #451a1a;
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      display: none;
    }
    .review-filter-btn.active {
      background: var(--danger);
      color: #fff;
    }

    .controls-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      min-width: 0;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 9px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .toggle-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      background: #172033;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .toggle-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .toggle-item input[type="checkbox"] {
      accent-color: var(--accent);
      cursor: pointer;
    }

    .card-wrap {
      width: 100%;
      max-width: 440px;
      height: 240px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #172033;
      border-color: #3b82f6;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Green Tick / Red Cross Indicator Badges */
    .card-status-badge {
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .status-unseen {
      background: #334155;
      color: var(--text-muted);
    }
    .status-passed {
      background: rgba(34, 197, 94, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }
    .status-failed {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid var(--danger);
    }

    .prompt-text {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: auto 0;
      color: var(--text-main);
      padding: 0 8px;
    }
    .n5-target-kanji {
      color: var(--kanji-target);
      font-weight: 800;
    }
    .answer-kana {
      font-size: 1.35rem;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
    }
    .answer-romaji {
      font-size: 1.05rem;
      color: #cbd5e1;
      text-align: center;
      font-style: italic;
    }
    .answer-meaning {
      font-size: 1.25rem;
      color: #f1f5f9;
      font-weight: 600;
      text-align: center;
      margin-top: 4px;
    }
    .tap-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .input-section {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .input-box {
      flex: 1;
      min-width: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    .input-box:focus {
      border-color: var(--accent);
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }
    .icon-btn.recording {
      background: #7f1d1d;
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .status-msg {
      width: 100%;
      max-width: 440px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 22px;
      margin-bottom: 8px;
    }
    .status-msg.correct { color: var(--success); }
    .status-msg.incorrect { color: var(--danger); }
    .status-msg.info { color: var(--accent); }

    /* Clean 3-Button Action Grid */
    .action-grid {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn {
      padding: 12px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .btn-skip { background: #475569; }
    .btn-flip { background: #3b82f6; }
    .btn-next { background: #0284c7; }
    .btn:active { opacity: 0.8; transform: translateY(1px); }
  </style>
</head>
<body>
  <header>
    <span>JLPT N5 Drill</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="review-filter-btn" id="reviewFailuresBtn">Failures: 0</button>
      <span class="badge" id="stats">0 / 0 (0%)</span>
    </div>
  </header>

  <div class="controls-grid">
    <select id="lessonFilter">
      <option value="all">All Lessons</option>
      <option value="1">L1: Basics</option>
      <option value="2">L2: Family & Items</option>
      <option value="3">L3: Office & Rooms</option>
      <option value="4">L4: Calendar & Time</option>
      <option value="5">L5: Verbs & Dining</option>
      <option value="6">L6: Transit & Spots</option>
      <option value="7">L7: Jobs & Hobbies</option>
      <option value="8">L8: Adjectives</option>
      <option value="9">L9: Food & Places</option>
      <option value="10">L10: Tastes & Likes</option>
      <option value="11">L11: Daily Life</option>
      <option value="12">L12: Weather & Nature</option>
      <option value="13">L13: Clothes & Wants</option>
      <option value="14">L14: Counters</option>
      <option value="15">L15: Health & Ability</option>
    </select>

    <select id="promptMode">
      <option value="n5reading">Kanji ➔ Reading (153 N5 Kanji)</option>
      <option value="kana">Furigana ➔ English (All 677)</option>
      <option value="kanji">All Kanji/Kana ➔ English (677)</option>
      <option value="english">English ➔ Japanese (677)</option>
      <option value="mixed">Mixed Drill</option>
    </select>
  </div>

  <div class="toggle-bar">
    <label class="toggle-item">
      <input type="checkbox" id="toggleAutoSpeak" />
      <span>Auto-speak prompt</span>
    </label>
    <label class="toggle-item">
      <input type="checkbox" id="toggleAutoListen" />
      <span>Auto-listen (mic)</span>
    </label>
  </div>

  <div class="card-wrap" id="cardWrap">
    <div class="card-inner" id="cardInner">
      <div class="card-front">
        <div class="card-meta">
          <span id="promptLabel">KANJI</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="card-status-badge status-unseen" id="cardStatusFront">Unseen</span>
            <button class="icon-btn" id="speakerBtn" style="padding:4px 8px; font-size:1rem;" title="Listen">🔊</button>
          </div>
        </div>
        <div class="prompt-text" id="promptText">Loading...</div>
        <div class="tap-hint">Tap card or press [Flip] to reveal</div>
      </div>
      <div class="card-back">
        <div class="card-meta">
          <span>ANSWER</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span class="card-status-badge status-unseen" id="cardStatusBack">Unseen</span>
            <span id="lessonTag" style="color:var(--accent);">L1</span>
          </div>
        </div>
        <div style="margin: auto 0; display:flex; flex-direction:column; gap:6px;">
          <div class="answer-kana" id="ansKana">--</div>
          <div class="answer-romaji" id="ansRomaji">--</div>
          <div class="answer-meaning" id="ansMeaning">--</div>
        </div>
        <div class="tap-hint">Tap to flip back</div>
      </div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="input-section">
    <input 
      type="text" 
      id="userInput" 
      class="input-box" 
      placeholder="Type answer or 'skip'..." 
      autocomplete="off" 
      autocorrect="off" 
      autocapitalize="off" 
      spellcheck="false"
    />
    <button class="icon-btn" id="micBtn" title="Speak Answer">🎤</button>
  </div>

  <!-- Clear 3-Action Bar: Skip, Flip, Next -->
  <div class="action-grid">
    <button class="btn btn-skip" id="btnSkip">↷ Skip</button>
    <button class="btn btn-flip" id="btnFlip">↻ Flip</button>
    <button class="btn btn-next" id="btnNext">Next ➔</button>
  </div>

<script src="vocab.js"></script>

  <script>
    const N5_KANJI_SET = new Set([
      "一","二","三","四","五","六","七","八","九","十","百","千","万","円","年","日","月","火","水","木","金","土",
      "今","前","後","午","朝","昼","晩","夜","分","半","時","週","間","毎","先","来","去","何",
      "上","下","左","右","東","西","南","北","中","外",
      "駅","校","高","大","小","長","短","白","黒","赤","青","新","古","多","少","安","近","遠","広","早","明","暗","好",
      "友","手","足","目","耳","口","体","人","子","女","男","父","母","兄","弟","姉","妹",
      "見","聞","行","帰","食","飲","入","出","立","休","買","書","読","話","言",
      "天","気","雨","電","車","名","国","社","店","道","山","川","花","魚","空"
    ]);

    function isKanjiChar(ch) {
      return /[\u4e00-\u9faf]/.test(ch);
    }

    function isStrictN5KanjiWord(word) {
      if (!word) return false;
      let hasKanji = false;
      for (const ch of word) {
        if (isKanjiChar(ch)) {
          hasKanji = true;
          if (!N5_KANJI_SET.has(ch)) return false;
        }
      }
      return hasKanji;
    }

    function formatPromptKanji(str) {
      if (!str) return "";
      let html = "";
      for (const ch of str) {
        if (N5_KANJI_SET.has(ch)) {
          html += `<span class="n5-target-kanji">${ch}</span>`;
        } else {
          html += ch;
        }
      }
      return html;
    }

    let currentDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let recognition = null;
    let isRecording = false;
    let listenTimer = null;

    const sessionHistory = new Map();
    let isReviewingFailures = false;

    let totalAttempts = 0;
    let correctCount = 0;
    let autoAdvanceTimer = null;

    const cardWrap = document.getElementById('cardWrap');
    const cardInner = document.getElementById('cardInner');
    const promptText = document.getElementById('promptText');
    const promptLabel = document.getElementById('promptLabel');
    const cardStatusFront = document.getElementById('cardStatusFront');
    const cardStatusBack = document.getElementById('cardStatusBack');
    const ansKana = document.getElementById('ansKana');
    const ansRomaji = document.getElementById('ansRomaji');
    const ansMeaning = document.getElementById('ansMeaning');
    const lessonTag = document.getElementById('lessonTag');
    const stats = document.getElementById('stats');
    const statusMsg = document.getElementById('statusMsg');
    const userInput = document.getElementById('userInput');
    const speakerBtn = document.getElementById('speakerBtn');
    const micBtn = document.getElementById('micBtn');
    const lessonFilter = document.getElementById('lessonFilter');
    const promptMode = document.getElementById('promptMode');
    const btnSkip = document.getElementById('btnSkip');
    const btnFlip = document.getElementById('btnFlip');
    const btnNext = document.getElementById('btnNext');
    const reviewFailuresBtn = document.getElementById('reviewFailuresBtn');
    const toggleAutoSpeak = document.getElementById('toggleAutoSpeak');
    const toggleAutoListen = document.getElementById('toggleAutoListen');

    function getCardKey(card) {
      return `${card.l}-${card.k}-${card.f}`;
    }

    function updateStatsHeader() {
      const pct = totalAttempts === 0 ? 0 : Math.round((correctCount / totalAttempts) * 100);
      stats.textContent = `${correctCount} / ${totalAttempts} (${pct}%) • ${currentDeck.length ? currentIndex + 1 : 0}/${currentDeck.length}`;

      let failureCount = 0;
      sessionHistory.forEach((status) => {
        if (status === 'failed') failureCount++;
      });
      if (failureCount > 0) {
        reviewFailuresBtn.style.display = "block";
        reviewFailuresBtn.textContent = isReviewingFailures ? `Exit Review (${failureCount})` : `Review Failed (${failureCount})`;
      } else {
        reviewFailuresBtn.style.display = "none";
      }
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initDeck() {
      destroyVoiceEngine();
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      if (listenTimer) clearTimeout(listenTimer);

      const data = window.VOCAB_DATA;
      if (!data || data.length === 0) {
        promptText.textContent = "vocab.js missing";
        statusMsg.textContent = "vocab.js not found.";
        return;
      }

      let filtered = [...data];

      if (isReviewingFailures) {
        filtered = filtered.filter(item => sessionHistory.get(getCardKey(item)) === 'failed');
        reviewFailuresBtn.classList.add('active');
      } else {
        reviewFailuresBtn.classList.remove('active');
        const selectedLesson = lessonFilter ? lessonFilter.value : 'all';
        if (selectedLesson !== 'all') {
          const num = parseInt(selectedLesson, 10);
          filtered = filtered.filter(item => item.l === num);
        }

        const activeModeVal = promptMode ? promptMode.value : 'n5reading';
        if (activeModeVal === 'n5reading') {
          filtered = filtered.filter(item => isStrictN5KanjiWord(item.k));
        }
      }

      currentDeck = filtered;
      shuffle(currentDeck);
      currentIndex = 0;
      loadCard();
    }

    function getActiveMode() {
      const mode = promptMode ? promptMode.value : 'n5reading';
      if (mode === 'mixed') {
        const modes = ['n5reading', 'kanji', 'kana', 'english'];
        return modes[Math.floor(Math.random() * modes.length)];
      }
      return mode;
    }

    let activeCardMode = 'n5reading';

    function setBadgeVisual(el, status) {
      el.className = 'card-status-badge';
      if (status === 'passed') {
        el.classList.add('status-passed');
        el.textContent = '✓ Pass';
      } else if (status === 'failed') {
        el.classList.add('status-failed');
        el.textContent = '✗ Fail';
      } else {
        el.classList.add('status-unseen');
        el.textContent = 'Unseen';
      }
    }

    function loadCard() {
      destroyVoiceEngine();
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      if (listenTimer) clearTimeout(listenTimer);

      if (!currentDeck || currentDeck.length === 0) {
        promptLabel.textContent = "INFO";
        promptText.innerHTML = isReviewingFailures ? "No failed cards left!" : "No cards in filter";
        ansKana.textContent = "--";
        ansRomaji.textContent = "--";
        ansMeaning.textContent = "--";
        updateStatsHeader();
        return;
      }
      isFlipped = false;
      cardInner.classList.remove('flipped');
      statusMsg.textContent = "";
      statusMsg.className = "status-msg";
      userInput.value = "";

      const card = currentDeck[currentIndex];
      activeCardMode = getActiveMode();

      const currentStatus = sessionHistory.get(getCardKey(card)) || 'unseen';
      setBadgeVisual(cardStatusFront, currentStatus);
      setBadgeVisual(cardStatusBack, currentStatus);

      if (activeCardMode === 'n5reading') {
        promptLabel.textContent = "KANJI ➔ READING (ROMAJI/KANA)";
        promptText.innerHTML = formatPromptKanji(card.k || card.f);
        userInput.placeholder = "Type/speak reading...";
      } else if (activeCardMode === 'kanji') {
        promptLabel.textContent = "KANJI ➔ ENGLISH MEANING";
        promptText.innerHTML = formatPromptKanji(card.k || card.f);
        userInput.placeholder = "Type/speak English...";
      } else if (activeCardMode === 'kana') {
        promptLabel.textContent = "FURIGANA ➔ ENGLISH";
        promptText.textContent = card.f;
        userInput.placeholder = "Type/speak English...";
      } else if (activeCardMode === 'english') {
        promptLabel.textContent = "ENGLISH ➔ JAPANESE";
        promptText.textContent = card.e.split('/')[0].trim();
        userInput.placeholder = "Type/speak Japanese reading...";
      }

      ansKana.textContent = card.f;
      ansRomaji.textContent = card.r;
      ansMeaning.textContent = card.e;
      lessonTag.textContent = "L" + card.l;
      updateStatsHeader();

      // Handshake: audio output finishes first, then mic opens cleanly
      if (toggleAutoSpeak && toggleAutoSpeak.checked) {
        if (activeCardMode !== 'n5reading') {
          triggerAudioPrompt(() => {
            if (toggleAutoListen && toggleAutoListen.checked) {
              listenTimer = setTimeout(spawnVoiceSession, 350);
            }
          });
          return;
        }
      }

      if (toggleAutoListen && toggleAutoListen.checked) {
        listenTimer = setTimeout(spawnVoiceSession, 350);
      }
    }

    function triggerAudioPrompt(onDoneCallback) {
      if (!currentDeck.length) return;
      const card = currentDeck[currentIndex];
      if (activeCardMode === 'english') {
        speakText(card.e.split('/')[0], 'en-US', onDoneCallback);
      } else {
        speakText(card.f, 'ja-JP', onDoneCallback);
      }
    }

    function flipCard() {
      if (!currentDeck.length) return;
      isFlipped = !isFlipped;
      if (isFlipped) {
        cardInner.classList.add('flipped');
      } else {
        cardInner.classList.remove('flipped');
      }
    }

    function advanceNext() {
      destroyVoiceEngine();
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      if (listenTimer) clearTimeout(listenTimer);

      if (currentIndex < currentDeck.length - 1) {
        currentIndex++;
        loadCard();
      } else {
        statusMsg.textContent = "Deck finished! Reshuffling...";
        statusMsg.className = "status-msg info";
        setTimeout(initDeck, 1200);
      }
    }

    function skipCard() {
      if (!currentDeck.length) return;
      statusMsg.textContent = "Skipped";
      statusMsg.className = "status-msg info";
      advanceNext();
    }

    function cleanStr(s) {
      return (s || "")
        .toLowerCase()
        .replace(/^to\s+/, '')
        .replace(/^(a|an|the)\s+/, '')
        .replace(/[^a-z0-9ぁ-んァ-ヶー]/g, '');
    }

    function checkAnswer(val) {
      if (!val || !val.trim() || !currentDeck.length) return;
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      
      const cleanInput = cleanStr(val);

      if (cleanInput === "skip" || cleanInput === "next") {
        skipCard();
        return;
      }

      totalAttempts++;
      const card = currentDeck[currentIndex];
      const cardKey = getCardKey(card);
      let isCorrect = false;

      if (activeCardMode === 'n5reading' || activeCardMode === 'english') {
        const cleanedRomaji = cleanStr(card.r);
        const altRomaji = cleanedRomaji.replace(/oo/g, 'ou').replace(/ee/g, 'ei');
        const cleanKana = cleanStr(card.f);
        
        isCorrect = (
          cleanInput === cleanedRomaji || 
          cleanInput === altRomaji || 
          cleanInput === cleanKana || 
          cleanInput.replace(/ou/g, 'oo') === cleanedRomaji
        );
      } else {
        const meanings = card.e.split(/[\/,]/).map(cleanStr);
        isCorrect = meanings.some(m => m === cleanInput || (m.length > 3 && cleanInput.includes(m)));
      }

      if (isCorrect) {
        destroyVoiceEngine(); // Kill mic immediately to free audio device for transition
        correctCount++;
        sessionHistory.set(cardKey, 'passed');
        setBadgeVisual(cardStatusFront, 'passed');
        setBadgeVisual(cardStatusBack, 'passed');

        statusMsg.textContent = "Correct! ✓";
        statusMsg.className = "status-msg correct";
        updateStatsHeader();
        if (!isFlipped) flipCard();

        autoAdvanceTimer = setTimeout(() => {
          advanceNext();
        }, 850);
      } else {
        sessionHistory.set(cardKey, 'failed');
        setBadgeVisual(cardStatusFront, 'failed');
        setBadgeVisual(cardStatusBack, 'failed');

        statusMsg.textContent = "Incorrect. Check answer & tap [Next ➔]";
        statusMsg.className = "status-msg incorrect";
        updateStatsHeader();
        if (!isFlipped) flipCard();
      }
    }

    function speakText(txt, lang, onEnd) {
      if (!('speechSynthesis' in window)) {
        if (onEnd) onEnd();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = lang || 'ja-JP';
        u.rate = 0.9;
        if (onEnd) {
          u.onend = onEnd;
          u.onerror = onEnd;
        }
        window.speechSynthesis.speak(u);
      } catch (err) {
        if (onEnd) onEnd();
      }
    }

    // --- REGENERATIVE SPEECH RECOGNITION ENGINE ---
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

    function destroyVoiceEngine() {
      if (recognition) {
        try {
          recognition.onstart = null;
          recognition.onresult = null;
          recognition.onerror = null;
          recognition.onend = null;
          recognition.abort();
        } catch (e) {}
        recognition = null;
      }
      isRecording = false;
      micBtn.classList.remove('recording');
    }

    function spawnVoiceSession() {
      if (!SpeechRec) return;
      destroyVoiceEngine();

      try {
        const rec = new SpeechRec();
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = (activeCardMode === 'n5reading' || activeCardMode === 'english') ? 'ja-JP' : 'en-US';

        rec.onstart = () => {
          isRecording = true;
          micBtn.classList.add('recording');
          statusMsg.textContent = "Listening...";
          statusMsg.className = "status-msg info";
        };

        rec.onresult = (evt) => {
          const transcript = evt.results[0][0].transcript;
          userInput.value = transcript;
          checkAnswer(transcript);
        };

        rec.onerror = (e) => {
          destroyVoiceEngine();
          // Silently recover from abort/no-speech without freezing the app
          if (e.error === 'aborted' || e.error === 'no-speech') {
            if (toggleAutoListen && toggleAutoListen.checked && !isFlipped) {
              listenTimer = setTimeout(spawnVoiceSession, 400);
            }
            return;
          }
          statusMsg.textContent = "Voice error: " + (e.error || 'Retry');
          statusMsg.className = "status-msg incorrect";
        };

        rec.onend = () => {
          destroyVoiceEngine();
        };

        recognition = rec;
        rec.start();
      } catch (err) {
        destroyVoiceEngine();
        if (toggleAutoListen && toggleAutoListen.checked && !isFlipped) {
          listenTimer = setTimeout(spawnVoiceSession, 450);
        }
      }
    }

    if (cardWrap) cardWrap.onclick = flipCard;
    if (btnFlip) btnFlip.onclick = flipCard;
    if (btnSkip) btnSkip.onclick = skipCard;
    if (btnNext) btnNext.onclick = advanceNext;

    if (reviewFailuresBtn) {
      reviewFailuresBtn.onclick = () => {
        isReviewingFailures = !isReviewingFailures;
        initDeck();
      };
    }

    if (speakerBtn) {
      speakerBtn.onclick = (e) => {
        e.stopPropagation();
        triggerAudioPrompt();
      };
    }

    if (userInput) {
      userInput.onkeydown = (e) => {
        if (e.key === 'Enter') {
          checkAnswer(userInput.value);
        }
      };
    }

    if (lessonFilter) lessonFilter.onchange = initDeck;
    if (promptMode) promptMode.onchange = initDeck;

    if (micBtn) {
      micBtn.onclick = (e) => {
        e.stopPropagation();
        if (isRecording) {
          destroyVoiceEngine();
          statusMsg.textContent = "";
        } else {
          spawnVoiceSession();
        }
      };
    }

    initDeck();
  </script>
