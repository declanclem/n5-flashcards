<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JLPT N5 Rapid Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .badge {
      background: #334155;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      font-size: 0.8rem;
    }
    .controls-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      flex: 1;
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .card-wrap {
      width: 100%;
      max-width: 480px;
      height: 250px;
      perspective: 1000px;
      cursor: pointer;
      margin-bottom: 16px;
    }
    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }
    .card-back {
      transform: rotateY(180deg);
      background: #172033;
      border-color: #3b82f6;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .prompt-text {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin: auto 0;
      color: var(--text-main);
    }
    .answer-kana {
      font-size: 1.4rem;
      color: var(--accent);
      font-weight: 600;
      text-align: center;
    }
    .answer-romaji {
      font-size: 1.1rem;
      color: #cbd5e1;
      text-align: center;
      font-style: italic;
    }
    .answer-meaning {
      font-size: 1.3rem;
      color: #f1f5f9;
      font-weight: 600;
      text-align: center;
      margin-top: 4px;
    }
    .tap-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .input-section {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .input-box {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      user-select: text;
    }
    .input-box:focus {
      border-color: var(--accent);
    }
    .icon-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 0 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .icon-btn.recording {
      background: #7f1d1d;
      border-color: var(--danger);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
    .action-grid {
      width: 100%;
      max-width: 480px;
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 14px 8px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
    }
    .btn-missed { background: #dc2626; }
    .btn-flip { background: #3b82f6; }
    .btn-gotit { background: #16a34a; }
    .btn:active { opacity: 0.8; transform: translateY(1px); }
    .status-msg {
      width: 100%;
      max-width: 480px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 24px;
      margin-bottom: 8px;
    }
    .status-msg.correct { color: var(--success); }
    .status-msg.incorrect { color: var(--danger); }
    .status-msg.info { color: var(--accent); }
  </style>
</head>
